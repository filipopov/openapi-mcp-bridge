# All logging goes to stderr: stdout is the MCP JSON-RPC channel when running over stdio.
org.slf4j.simpleLogger.logFile=System.err
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true
org.slf4j.simpleLogger.log.io.swagger=warn
# The SDK logs full JSON-RPC payloads at debug level; keep it quiet even with --verbose.
org.slf4j.simpleLogger.log.io.modelcontextprotocol=warn
