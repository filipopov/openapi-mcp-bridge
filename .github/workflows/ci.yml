name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload fat jar
        uses: actions/upload-artifact@v4
        with:
          name: openapi-mcp-bridge
          path: target/openapi-mcp-bridge.jar
          if-no-files-found: error
